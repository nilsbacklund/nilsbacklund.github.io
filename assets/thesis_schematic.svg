<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2a26"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c45d3a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b635a"/>
    </marker>
  </defs>

  <!-- ===== Neural network ===== -->
  <!-- connections input -> hidden1 -->
  <g stroke="#d8cfc4" stroke-width="1.5">
    <line x1="120" y1="165" x2="215" y2="115"/><line x1="120" y1="165" x2="215" y2="195"/><line x1="120" y1="165" x2="215" y2="275"/>
    <line x1="120" y1="245" x2="215" y2="115"/><line x1="120" y1="245" x2="215" y2="195"/><line x1="120" y1="245" x2="215" y2="275"/>
    <line x1="215" y1="115" x2="310" y2="115"/><line x1="215" y1="115" x2="310" y2="195"/><line x1="215" y1="115" x2="310" y2="275"/>
    <line x1="215" y1="195" x2="310" y2="115"/><line x1="215" y1="195" x2="310" y2="195"/><line x1="215" y1="195" x2="310" y2="275"/>
    <line x1="215" y1="275" x2="310" y2="115"/><line x1="215" y1="275" x2="310" y2="195"/><line x1="215" y1="275" x2="310" y2="275"/>
    <line x1="310" y1="115" x2="405" y2="195"/><line x1="310" y1="195" x2="405" y2="195"/><line x1="310" y1="275" x2="405" y2="195"/>
  </g>

  <!-- input nodes -->
  <circle cx="120" cy="165" r="26" fill="#c45d3a"/>
  <text x="120" y="171" text-anchor="middle" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#fff">T<tspan font-size="11" dy="-6">k</tspan></text>
  <circle cx="120" cy="245" r="26" fill="#c45d3a"/>
  <text x="120" y="251" text-anchor="middle" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#fff">u<tspan font-size="11" dy="-6">k</tspan></text>

  <!-- hidden nodes -->
  <g fill="#e0b8a4">
    <circle cx="215" cy="115" r="22"/><circle cx="215" cy="195" r="22"/><circle cx="215" cy="275" r="22"/>
    <circle cx="310" cy="115" r="22"/><circle cx="310" cy="195" r="22"/><circle cx="310" cy="275" r="22"/>
  </g>

  <!-- output node -->
  <circle cx="405" cy="195" r="26" fill="#c45d3a"/>
  <text x="405" y="201" text-anchor="middle" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#fff">&#952;<tspan font-size="11" dy="-6">k</tspan></text>

  <!-- arrow NN -> model -->
  <line x1="437" y1="195" x2="560" y2="195" stroke="#c45d3a" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <text x="498" y="158" text-anchor="middle" font-size="13" fill="#6b635a">predicted</text>
  <text x="498" y="176" text-anchor="middle" font-size="13" fill="#6b635a">parameters</text>

  <!-- ===== Lumped thermal model ===== -->
  <!-- body 1 -->
  <rect x="620" y="105" width="170" height="60" rx="10" fill="#2d2a26"/>
  <text x="705" y="141" text-anchor="middle" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#fff">T<tspan font-size="11" dy="4">1</tspan><tspan dy="-4">, C</tspan><tspan font-size="11" dy="4">1</tspan></text>

  <!-- body 2 -->
  <rect x="620" y="235" width="170" height="60" rx="10" fill="#2d2a26"/>
  <text x="705" y="271" text-anchor="middle" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#fff">T<tspan font-size="11" dy="4">2</tspan><tspan dy="-4">, C</tspan><tspan font-size="11" dy="4">2</tspan></text>

  <!-- resistance zigzag between bodies -->
  <path d="M 705 165 L 705 175 L 693 180 L 717 190 L 693 200 L 717 210 L 693 220 L 705 225 L 705 235" fill="none" stroke="#2d2a26" stroke-width="2.5"/>
  <text x="730" y="205" font-size="15" font-style="italic" font-family="Georgia, serif" fill="#2d2a26">R</text>

  <!-- heat inputs -->
  <line x1="555" y1="135" x2="612" y2="135" stroke="#2d2a26" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="546" y="141" text-anchor="end" font-size="15" font-style="italic" font-family="Georgia, serif" fill="#2d2a26">Q<tspan font-size="11" dy="4">1</tspan></text>
  <line x1="555" y1="265" x2="612" y2="265" stroke="#2d2a26" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="546" y="271" text-anchor="end" font-size="15" font-style="italic" font-family="Georgia, serif" fill="#2d2a26">Q<tspan font-size="11" dy="4">2</tspan></text>

  <!-- output lines to T^{k+1} -->
  <path d="M 790 135 L 850 135 L 850 265 L 790 265" fill="none" stroke="#2d2a26" stroke-width="3"/>
  <text x="862" y="206" font-size="17" font-style="italic" font-family="Georgia, serif" fill="#2d2a26">T<tspan font-size="11" dy="-6">k+1</tspan></text>

  <!-- recurrency: dashed line from output back to input -->
  <path d="M 850 135 L 850 45 L 120 45 L 120 131" fill="none" stroke="#6b635a" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="485" y="33" text-anchor="middle" font-size="13" fill="#6b635a">next time step</text>
</svg>
